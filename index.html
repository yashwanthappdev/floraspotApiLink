<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    http-equiv="refresh"
    content="0; url=https://calculate-careers-possess-parks.trycloudflare.com"
  />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Redirecting...</title>

  <style>

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        135deg,
        #ffffff,
        #f8fafc,
        #fefce8
      );
      font-family: Arial, sans-serif;
    }

    .loader-box {
      padding: 28px 36px;
      border-radius: 24px;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(18px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
      text-align: center;
    }

    .loader {
      width: 42px;
      height: 42px;
      border: 4px solid #ececec;
      border-top: 4px solid #111111;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 18px;
    }

    .text {
      color: #1f1f1f;
      font-size: 15px;
      letter-spacing: 1px;
      font-weight: 600;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

  </style>
</head>

<body>

  <div class="loader-box">

    <div class="loader"></div>

    <div class="text">
      Redirecting...
    </div>

  </div>

  <script>
    window.location.href =
      "https://calculate-careers-possess-parks.trycloudflare.com";
  </script>

</body>
</html>
